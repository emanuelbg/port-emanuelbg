name: Monitorar Atualizações do Template

on:
  schedule:
    - cron: '0 0 * * 0' # Toda semana
  workflow_dispatch: # Botão manual

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout do seu código
        uses: actions/checkout@v4.1.2
        with:
          fetch-depth: 0

      - name: Criar branch de atualização e verificar mudanças
        id: sync
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # Garante que qualquer tentativa de merge travada anterior seja cancelada e limpa
          git merge --abort || true
          git reset --hard HEAD
          
          # Cria a ramificação separada de forma limpa a partir da sua main atual
          git checkout -b template-updates
          
          # Conecta ao template original
          git remote add template https://github.com/felipeszarena/Template-fsza.works.git || true
          git fetch template
          
          # Tenta trazer as novidades. Se houver conflito, o robô CONTINUA para criarmos a PR
          git merge template/main --allow-unrelated-histories -m "Chore: Atualizações vindas do template original" || true

      - name: Criar Pull Request de Revisão
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: template-updates
          title: "🔄 Novas atualizações disponíveis no Template Original"
          body: |
            O robô encontrou atualizações no repositório original do template!
            
            Revise as alterações na aba **Files changed** acima antes de aprovar.
            Se houver conflitos, você poderá ver quais arquivos precisam de atenção.
          base: main
