name: Monitorar Atualizações do Template

on:
  schedule:
    - cron: '0 0 * * 0' # Toda semana
  workflow_dispatch: # Botão manual

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout do seu código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git e buscar atualizações do template
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # Conecta ao template original do Felipe
          git remote add template https://github.com/felipeszarena/Template-fsza.works.git || true
          git fetch template

          # Cria uma nova branch local baseada PURAMENTE na branch do Felipe
          git checkout -b template-updates template/main

      - name: Criar Pull Request de Revisão
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: template-updates
          title: "🔄 Novas atualizações disponíveis no Template Original"
          body: |
            O robô encontrou atualizações no repositório original do template!
            
            Como existem arquivos modificados por você e pelo criador, revise as alterações na aba **Files changed** acima antes de aprovar.
          base: main
