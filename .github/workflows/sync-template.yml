name: Monitorar Atualizações do Template

on:
  schedule:
    - cron: '0 0 * * 0' # Toda semana
  workflow_dispatch: # Botão manual

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do seu código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar e Enviar Branch de Revisão
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 1. Garante que estamos na main atualizada
          git checkout main
          git pull origin main || true

          # 2. Deleta a branch local antiga se ela existir para evitar conflitos de cache
          git branch -D template-updates || true

          # 3. Conecta ao template original do Felipe e baixa as novidades
          git remote add template https://github.com/felipeszarena/Template-fsza.works.git || true
          git fetch template

          # 4. Cria a branch 'template-updates' idêntica à branch do Felipe
          git checkout -b template-updates template/main

          # 5. Força o envio dessa branch limpa para o SEU GitHub
          git push origin template-updates --force
